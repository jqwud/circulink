# Run the image the pipeline published to the GitHub Container Registry, instead of building one here:
#   docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
# Choose a version with CIRCULINK_TAG (default: latest, the newest commit on main that passed every check):
#   CIRCULINK_TAG=1.0.0 docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d
# See docs/CICD.md.

services:
  api:
    image: ghcr.io/jqwud/circulink:${CIRCULINK_TAG:-latest}
    pull_policy: always
