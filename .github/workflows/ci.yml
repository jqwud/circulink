# CI: checks every push and pull request: the API tests on a real MySQL (with the R1 to R13 rule tests), the
# app's analysis and tests, the portal's lint and build, the containers, and end-to-end tests of the portal
# and the app against a real server.
# CD: when ALL of those pass on a push to main or on a v* tag, the Docker image is built and pushed to the
# GitHub Container Registry (ghcr.io). Pull requests and other branches are only checked, never published.
# More in docs/CICD.md.
name: CI/CD

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

# Jobs may only read the code. The publish job alone is also allowed to write packages.
permissions:
  contents: read

jobs:
  server:
    name: API (lint and tests on MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: circulink_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-root-password
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: mysqldump --version   # the backup and restore tests need the MySQL command-line tools
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Verify Secret Configuration
        env:
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          if [ -z "$DEMO_API_KEY" ]; then
            echo "DEMO_API_KEY is not set"
            exit 1
          fi
          echo "DEMO_API_KEY is configured (value hidden)"

  app:
    name: App (analyze and tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  containers:
    name: Containers (build, start, health check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settings for this run only (a fresh random secret)
        run: |
          cp docker.env.example docker.env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" docker.env
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet
      - run: docker compose -f docker-compose.yml -f docker-compose.ghcr.yml config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: curl -fsS http://localhost:4000/api/health
      - run: curl -fsS http://localhost:4000/ | grep -q 'id="root"'
      - run: docker compose exec -T api npm run migrate:status
      - name: Logs if something failed
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  portal:
    name: Portal (lint and build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    name: End to end (portal in a browser, app screens on the real API)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: circulink_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ci-root-password
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            portal/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm ci
        working-directory: portal
      - run: npx playwright install --with-deps chromium
        working-directory: portal
      - run: npm run test:e2e
        working-directory: portal
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.4
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      # On failure the last lines also become an error note on the run, readable without logging in.
      - name: App journeys on the real API
        working-directory: app
        run: |
          node tools/e2e.mjs 2>&1 | tee e2e.log
          code=${PIPESTATUS[0]}
          if [ "$code" != "0" ]; then
            echo "::error title=App journeys failed::$(grep -v '^\s*$' e2e.log | tail -60 | cut -c1-200 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          fi
          exit $code

  publish:
    name: Publish the image to GHCR (main and v* tags only)
    # One failed or skipped check above and this job does not run: a broken rule never reaches the registry.
    needs: [server, app, containers, portal, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # The token GitHub makes for this run; no password or secret is stored anywhere.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # main -> :latest and :sha-<commit>; tag v1.2.3 -> :1.2.3 and :1.2
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      # The same Dockerfile the containers job tested: the portal is built inside the image, nothing prebuilt is copied in.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Say what was published
        run: |
          {
            echo "### Published"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
